openapi: 3.1.0
info:
  title: 저장된 재배정 계획 목록 조회 (API 093)
  version: "2026-11-17"
  description: >-
    S15P31C106-451 생성자 이름 필터 확장 계약.
    기존 fromEquipmentId, createdBy, page, size 조건과 응답 형식을 유지한다.
    계획이 참조하는 객체 유형의 기존 조회 권한과 민감 값 가림을 적용한다.
paths:
  /api/v1/reassignment-plans:
    get:
      operationId: searchReassignmentPlans
      summary: 저장된 재배정 계획 목록
      description: >-
        최신 생성 시각·ID 내림차순. 전달된 조건은 AND로 적용한다.
        생성자 이름은 현재 계정 표시 이름의 대소문자 구분 없는 부분 일치이며,
        앞뒤 공백을 제거하고 빈 이름은 조건을 적용하지 않는다.
        %, _, 역슬래시는 글자 그대로 검색하며 동명이인의 계획은 모두 포함한다.
        계정 목록 관리 권한은 요구하지 않고 별도 계정 정보는 반환하지 않는다.
      parameters:
        - in: query
          name: fromEquipmentId
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: createdBy
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: createdByName
          description: 생성자의 현재 표시 이름 (선택, 부분 일치)
          schema: { type: string, maxLength: 100 }
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, default: 20 }
      responses:
        "200":
          description: 기존 계획·항목 목록과 페이지 메타데이터
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    description: 기존 API 093·094의 ReassignmentPlan 응답 (항목 포함, 변경 없음)
                    items: { type: object }
                  meta:
                    type: object
                    required: [page, size, totalElements, hasNext]
                    properties:
                      page: { type: integer }
                      size: { type: integer }
                      totalElements: { type: integer, format: int64 }
                      hasNext: { type: boolean }
        "400":
          description: 이름 100자 초과 또는 기존 ID·페이지 조건 검증 실패
        "401":
          description: 로그인 필요
