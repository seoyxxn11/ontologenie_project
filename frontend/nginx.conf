# frontend 컨테이너 안의 nginx 설정. 정적 파일(dist)만 서빙한다.
# HTTPS·보안 헤더·/api 라우팅은 메인 nginx(infra/nginx/conf.d/default.conf)가 맡는다. 여기서는 add_header를 쓰지 않는다.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 전송량 절약: js·css·svg는 압축해서 보낸다.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # react-router: /explorer 같은 주소로 새로고침해도 index.html을 준다 (SPA fallback). 없으면 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # vite 빌드 결과물은 파일 이름에 해시가 붙어 내용이 바뀌면 이름도 바뀐다 → 오래 캐시해도 안전.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html은 새 배포를 바로 보게 캐시하지 않는다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
