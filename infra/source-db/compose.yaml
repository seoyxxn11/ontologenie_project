# 원천(ERP·MES) 서버의 PostgreSQL. 서버마다 .env의 SOURCE_DB(erp / mes)만 다르다(S15P31C106-60~63).
# 로그 기반 CDC(Debezium)를 위해 처음부터 wal_level=logical로 띄운다. 이 값은 재시작해야 바뀐다.
# 서버의 ~/source-db/ 폴더에 이 파일과 pg_hba.conf, sql/, setup.sh를 두고 setup.sh로 세팅한다(README.md).
services:
  source-db:
    image: postgres:18.6
    container_name: source-db
    restart: unless-stopped
    # 서버 메모리 3.8GiB, 스왑 2GiB. PostgreSQL만 돌리므로 넉넉히 두되 서버 전체는 넘지 않게 한다.
    mem_limit: 2g
    command:
      - postgres
      - -c
      - wal_level=logical
      # 복제 슬롯·연결은 Debezium 커넥터 1개면 충분하다. 여유를 둔다.
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4
      # 소비자(Debezium)가 멈춰도 WAL이 30GB 디스크를 채우지 않게 상한을 둔다. 넘으면 슬롯이 깨지고 플랫폼이 전체 다시 읽기로 복구한다.
      - -c
      - max_slot_wal_keep_size=2GB
      # 논리 디코딩 출력 플러그인은 Debezium이 쓰는 pgoutput만 허용한다. platform_cdc(REPLICATION)가 test_decoding 같은 다른 플러그인으로
      # 슬롯을 만들면 publication 컬럼 목록과 상관없이 금지 컬럼의 변경까지 읽을 수 있기 때문이다(S15P31C106-415).
      - -c
      - output_plugin_libraries=pgoutput
      - -c
      - shared_buffers=256MB
      - -c
      - password_encryption=scram-sha-256
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/certs/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/certs/server.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: ${SOURCE_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    # 기본 포트를 그대로 열지 않는다(팀 규칙). 외부에서는 메인 서버 IP만 닿게 AWS 보안 그룹으로 막는다(Docker 포트는 호스트 방화벽을 우회한다).
    ports:
      - "15432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./certs:/etc/postgresql/certs:ro
      - ./sql:/sql:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${SOURCE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg-data:
    name: source-pg-data
