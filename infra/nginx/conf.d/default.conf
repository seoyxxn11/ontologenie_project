# 로그인 요청 계수기. 로그인 경로(/api/v1/auth/login)만 IP별로 횟수를 센다. 다른 경로는 키가 비어서 세지 않는다.
map $request_uri $login_limit_key {
    default                   "";
    "~^/api/v1/auth/login"    $binary_remote_addr;
}
# 계수기 이름 login, 메모리 10MB(IP 약 16만 개), 허용 속도 분당 30회. 실제 적용은 /api/ location의 limit_req.
limit_req_zone $login_limit_key zone=login:10m rate=30r/m;

# WebSocket 요청이면 Connection: upgrade, 아니면 close를 넘긴다(Kafka UI 메시지 조회 등).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Grafana Live WebSocket 연결용.
map $http_upgrade $grafana_connection_upgrade {
    default upgrade;
    ''      close;
}

# 앱이 이미 보낸 보안 헤더는 그대로 전달하고, 없는 항목만 nginx가 채운다.
# 빈 add_header 값은 헤더를 추가하지 않는다. nginx 자체 응답에는 기존 기본값을 쓴다.
map $upstream_http_strict_transport_security $fallback_hsts {
    default "";
    ""      "max-age=604800";
}

map $upstream_http_x_content_type_options $fallback_content_type_options {
    default "";
    ""      "nosniff";
}

map $upstream_http_x_frame_options $fallback_frame_options {
    default "";
    ""      "SAMEORIGIN";
}

# 354: 실제 전달 대상을 확인한다. 요청 본문·쿠키·토큰·쿼리 문자열은 기록하지 않는다.
log_format backend_routing escape=json
    '{"event":"backend_routing","time":"$time_iso8601",'
    '"method":"$request_method","status":"$status","upstream":"$upstream_addr"}';

server {
    listen 80;
    listen [::]:80;
    server_name k15c106.p.ssafy.io ontologenie.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name k15c106.p.ssafy.io ontologenie.com;
    server_tokens off;

    # 278: 기존 인증서를 두 도메인으로 확장한 뒤 반영한다. 인증서 이름·경로는 유지한다.
    ssl_certificate     /etc/letsencrypt/live/k15c106.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k15c106.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 354: API와 Swagger가 같은 대상을 쓴다. 활성 파일이 없으면 기존 backend를 유지한다.
    set $backend_upstream http://backend:8080;
    # 서버에서 선택하는 파일은 Git·설정 자동 배포와 분리한다. 백업은 이 마스크 밖에 둔다.
    include /etc/nginx/conf.d/runtime/backend-active*.inc;

    # 앱의 기존 값을 우선하고 없는 헤더만 보충한다. 오류 응답에도 적용한다(always).
    # location에 add_header를 추가하면 이 세 지시문이 상속되지 않으므로 함께 검토한다.
    add_header Strict-Transport-Security $fallback_hsts always;
    add_header X-Content-Type-Options $fallback_content_type_options always;
    add_header X-Frame-Options $fallback_frame_options always;

    location = /grafana {
        return 301 /grafana/$is_args$args;
    }

    location /grafana/ {
        resolver 127.0.0.11 valid=10s;
        set $grafana_upstream http://grafana:3000;
        # Grafana가 하위 경로를 처리하므로 /grafana/를 유지한다.
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $grafana_connection_upgrade;
        proxy_read_timeout 300s;
    }

    location = /jenkins {
        return 301 /jenkins/;
    }

    location /jenkins/ {
        proxy_pass http://jenkins:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_max_body_size 100m;
    }

    # 내부 API는 Docker 내부망에서 backend:8080으로 직접 호출한다.
    location = /api/v1/internal {
        return 403;
    }

    location ^~ /api/v1/internal/ {
        return 403;
    }

    # 백엔드 API (/api/v1/...). 경로를 바꾸지 않고 선택한 backend에 넘긴다.
    # /actuator 는 /api 밑이 아니므로 여기로 안 오고, 바깥에 열리지 않는다.
    location /api/ {
        access_log /var/log/nginx/access.log backend_routing;

        # 로그인 요청 제한(위 login 계수기). 한꺼번에 20회까지는 바로 통과, 그 뒤는 분당 30회. 넘으면 429.
        # 교육장은 팀 전체가 공인 IP 하나를 같이 쓰므로 느슨하게 잡았다. 로그인 외 경로는 키가 비어 제한하지 않는다.
        limit_req zone=login burst=20 nodelay;
        limit_req_status 429;

        # 선택한 대상의 이름은 Docker 내부 DNS로 해석한다. 대상이 준비되지 않으면 502가 날 수 있다.
        resolver 127.0.0.11 valid=10s;
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Agent 스트리밍(결정 13): 응답을 모아 두지 않고 글자가 나오는 대로 흘려보낸다. 긴 응답 대비 읽기 대기 5분.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;

        client_max_body_size 20m;
    }

    # Swagger(API 메뉴판): nginx 아이디·비밀번호(Basic Auth)로만 연다. 백엔드 로그인과 별개. 열쇠는 htpasswd 파일.
    location ~ ^/(swagger-ui\.html|swagger-ui/|v3/api-docs) {
        access_log /var/log/nginx/access.log backend_routing;

        auth_basic "axcore API docs";
        auth_basic_user_file /etc/nginx/htpasswd;

        resolver 127.0.0.11 valid=10s;
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
    }

    # Kafka 웹 화면(Redpanda Console, CDC용 infra/cdc). 화면 자체에 로그인이 없어 Swagger와 같은 아이디·비밀번호(Basic Auth)를 건다.
    # 토픽 메시지(원천 행 값)를 보고 커넥터를 재시작·삭제할 수 있으므로 계정은 팀 안에서만 공유한다.
    location = /kafka-ui {
        return 301 /kafka-ui/;
    }

    location /kafka-ui/ {
        auth_basic "axcore Kafka UI";
        auth_basic_user_file /etc/nginx/htpasswd;

        # kafka-console은 별도 compose 프로젝트(axcore-cdc)라 꺼져 있어도 nginx는 죽지 않고 502만 낸다.
        resolver 127.0.0.11 valid=10s;
        set $kafka_console_upstream http://kafka-console:8080;
        proxy_pass $kafka_console_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /kafka-ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 메시지 검색 결과를 나오는 대로 흘려보낸다.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 이전 탭이 참조하는 해시 파일도 제공한다. 목록·snapshot은 /assets 밖이라 공개하지 않는다.
    location /assets/ {
        root /srv/frontend-assets;
        disable_symlinks on;
        try_files $uri @frontend_assets;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security $fallback_hsts always;
        add_header X-Content-Type-Options $fallback_content_type_options always;
        add_header X-Frame-Options $fallback_frame_options always;
    }

    # 최초 도입·수동 롤백 등으로 보관소에 없는 파일은 현재 이미지에서 찾는다.
    location @frontend_assets {
        resolver 127.0.0.11 valid=10s;
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # 화면(React): frontend 컨테이너가 정적 파일을 준다. backend와 같은 방식(resolver + 변수)이라 frontend가 재시작 중이어도 nginx는 죽지 않고 502만 낸다.
    # 없는 경로를 index.html로 돌리는 SPA fallback은 frontend 컨테이너 안 nginx가 한다 (frontend/nginx.conf).
    # 더 구체적인 경로(/api/, /jenkins/, Swagger, /kafka-ui/, acme)가 먼저 잡히고, 나머지 전부가 여기로 온다.
    location / {
        resolver 127.0.0.11 valid=10s;
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
