# 로그인 요청 계수기. 로그인 경로(/api/v1/auth/login)만 IP별로 횟수를 센다. 다른 경로는 키가 비어서 세지 않는다.
map $request_uri $login_limit_key {
    default                   "";
    "~^/api/v1/auth/login"    $binary_remote_addr;
}
# 계수기 이름 login, 메모리 10MB(IP 약 16만 개), 허용 속도 분당 30회. 실제 적용은 /api/ location의 limit_req.
limit_req_zone $login_limit_key zone=login:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name k15c106.p.ssafy.io;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name k15c106.p.ssafy.io;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/k15c106.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k15c106.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 보안 헤더. 브라우저에게 "이 사이트는 이렇게 다뤄라"라고 알려 준다. server에만 둔다(location 안에 add_header를 쓰면 여기 것이 그 location에서 사라진다).
    add_header Strict-Transport-Security "max-age=604800" always;   # 1주일간 https로만 접속(HSTS). 인증서 갱신이 안정되면 1년(31536000)으로 늘린다.
    add_header X-Content-Type-Options "nosniff" always;              # 파일 종류를 브라우저가 멋대로 추측하지 않는다.
    add_header X-Frame-Options "SAMEORIGIN" always;                  # 다른 사이트가 우리 화면을 iframe으로 끼워 넣지 못한다(클릭재킹 방지).

    location = /jenkins {
        return 301 /jenkins/;
    }

    location /jenkins/ {
        proxy_pass http://jenkins:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_max_body_size 100m;
    }

    # 백엔드 API (/api/v1/...). 경로를 바꾸지 않고 그대로 backend:8080에 넘긴다.
    # /actuator 는 /api 밑이 아니므로 여기로 안 오고, 바깥에 열리지 않는다.
    location /api/ {
        # 로그인 요청 제한(위 login 계수기). 한꺼번에 20회까지는 바로 통과, 그 뒤는 분당 30회. 넘으면 429.
        # 교육장은 팀 전체가 공인 IP 하나를 같이 쓰므로 느슨하게 잡았다. 로그인 외 경로는 키가 비어 제한하지 않는다.
        limit_req zone=login burst=20 nodelay;
        limit_req_status 429;

        # Docker 내부 DNS로 매번 이름을 찾는다. backend가 재시작 중이어도 nginx는 죽지 않고 502만 낸다.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Agent 스트리밍(결정 13): 응답을 모아 두지 않고 글자가 나오는 대로 흘려보낸다. 긴 응답 대비 읽기 대기 5분.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;

        client_max_body_size 20m;
    }

    # Swagger(API 메뉴판): nginx 아이디·비밀번호(Basic Auth)로만 연다. 백엔드 로그인과 별개. 열쇠는 htpasswd 파일.
    location ~ ^/(swagger-ui\.html|swagger-ui/|v3/api-docs) {
        auth_basic "axcore API docs";
        auth_basic_user_file /etc/nginx/htpasswd;

        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_http_version 1.1;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
