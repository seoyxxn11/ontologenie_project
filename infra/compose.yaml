services:
  nginx:
    image: nginx:1.30
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - axcore-net

  certbot:
    image: certbot/certbot:v4.1.1
    profiles: ["tools"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  jenkins:
    build: ./jenkins
    image: axcore-jenkins:2.580.1
    container_name: jenkins
    restart: unless-stopped
    # 5-0c: MR 검사(gradle 빌드·테스트)가 이 컨테이너 안에서 돈다. 2026-11-01 실측: 평소 0.9GiB, gradle 전체 빌드·테스트 중 최고 2.0GiB → 4g면 여유 2배.
    mem_limit: 4g
    cpus: 2.0
    environment:
      JENKINS_OPTS: "--prefix=/jenkins"
      JAVA_OPTS: "-Xmx2g -Duser.timezone=Asia/Seoul"
      # MR 검사용 gradle 힙 상한. mem_limit 안에 들어가야 컨테이너가 죽지 않는다.
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1g"
      # 테스트용 PostgreSQL(Testcontainers)은 기본 bridge에 뜨고 서버 포트로 열린다. 이 컨테이너에서는 axcore-net 게이트웨이(=서버)로 닿는다.
      # 값 확인: docker network inspect axcore-net -f '{{(index .IPAM.Config 0).Gateway}}' (2026-10-30 실측 172.18.0.1, curl 200 확인)
      TESTCONTAINERS_HOST_OVERRIDE: "172.18.0.1"
    group_add:
      - "988"
    volumes:
      - ./jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # 배포용: 가게 폴더를 같은 주소로 연결. Jenkins가 compose.yaml·.env를 읽고 BACKEND_TAG를 갱신한다.
      - /home/ubuntu/axcore:/home/ubuntu/axcore
    networks:
      - axcore-net

  postgres:
    image: postgres:18.6
    container_name: postgres
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pg-data-18:/var/lib/postgresql
    networks:
      - axcore-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 플랫폼 백엔드 (Spring Boot, api 모드). 이미지 태그는 .env의 BACKEND_TAG (= 커밋 SHA).
  backend:
    image: axcore-backend:${BACKEND_TAG}
    container_name: backend
    restart: unless-stopped
    mem_limit: 2g
    environment:
      SPRING_PROFILES_ACTIVE: api
      AXCORE_INTERNAL_API_TOKEN: ${AXCORE_INTERNAL_API_TOKEN:-}
      AXCORE_AI_BASE_URL: http://ai:8000
      AXCORE_AGENT_LLM: ${AXCORE_AGENT_LLM:-none}
      AXCORE_AGENT_LLM_API_KEY: ${AI_ONTOLOGY_LLM_API_KEY:-}
      AXCORE_AGENT_LLM_BASE_URL: https://gms.ssafy.io/gmsapi/api.openai.com/v1
      # Agent 경로 후보 도구(OBJECT_PATHS, 381). 일반 설정이다. 382 비교 결과를 보고 켠다.
      AXCORE_AGENT_OBJECT_PATHS_ENABLED: ${AXCORE_AGENT_OBJECT_PATHS_ENABLED:-false}
      # Agent 객체 집합 도구(OBJECT_SET_*, 380·382). 일반 설정이다. 운영은 켠다. 여러 단계 관계 질문의 도구 호출을 줄인다(docs/agent-scenario-gms.md).
      # 끄려면 일반 설정에 false를 넣는다. 앱 기본값(application-api.yml)은 로컬·시험을 위해 false 그대로다.
      AXCORE_AGENT_OBJECT_SETS_ENABLED: ${AXCORE_AGENT_OBJECT_SETS_ENABLED:-true}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      TZ: Asia/Seoul
      # 최초 관리자 ID는 일반 설정, 비밀번호는 Jenkins Credentials에서 실행용 .env로 전달한다.
      AXCORE_INITIAL_ADMIN_LOGIN_ID: ${AXCORE_INITIAL_ADMIN_LOGIN_ID:-}
      AXCORE_INITIAL_ADMIN_PASSWORD: ${AXCORE_INITIAL_ADMIN_PASSWORD:-}
      # 원천 접속 비밀번호 암호화 키(64·275). 원천 등록 때 암호화, 분석 시작 때 AI 계정 복호화. ai 컨테이너에는 넣지 않는다.
      AXCORE_SOURCE_CREDENTIAL_KEY_1: ${AXCORE_SOURCE_CREDENTIAL_KEY_1:-}
      AXCORE_SOURCE_CREDENTIAL_KEY_VERSION: ${AXCORE_SOURCE_CREDENTIAL_KEY_VERSION:-1}
      # Handler 구현 요청 알림(288)의 Mattermost 팀 채널 Incoming Webhook. 주소 자체가 비밀값이라 Credentials에서만 넣는다. batch에는 넣지 않는다.
      AXCORE_ACTION_NOTIFY_WEBHOOK_URL: ${AXCORE_ACTION_NOTIFY_WEBHOOK_URL:-}
      # 알림에 넣을 Action 정의 화면의 서비스 주소(317). 비밀값이 아니라 .env.config에 둔다. 비우면 링크 없이 보낸다.
      AXCORE_ACTION_NOTIFY_SCREEN_BASE_URL: ${AXCORE_ACTION_NOTIFY_SCREEN_BASE_URL:-}
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - axcore-net
    # 컨테이너 안에서 자기 문(8080)을 두드린다. DB까지 포함한 전체 상태라 DB가 죽으면 unhealthy가 된다.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # backend와 같은 이미지의 비웹 배치 프로세스. 실제 작업 로직은 백엔드에서 구현한다.
  batch:
    image: axcore-backend:${BACKEND_TAG}
    container_name: batch
    restart: unless-stopped
    stop_grace_period: 40s
    # 초기 예산. 힙 외 메모리 256MiB를 남기고 실제 부하에서 조정한다.
    mem_limit: 1g
    cpus: 1.0
    environment:
      SPRING_PROFILES_ACTIVE: batch
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xmx768m
      TZ: Asia/Seoul
      # 원천 접속 비밀번호 암호화 키(64·275). 수집·연결 검사 때 SYNC 계정 복호화. backend와 같은 값이다.
      AXCORE_SOURCE_CREDENTIAL_KEY_1: ${AXCORE_SOURCE_CREDENTIAL_KEY_1:-}
      AXCORE_SOURCE_CREDENTIAL_KEY_VERSION: ${AXCORE_SOURCE_CREDENTIAL_KEY_VERSION:-1}
      # CDC 소비 루프(198-6). 커넥터를 등록한 뒤 .env.config에서 true로 켠다(infra/cdc/README.md "운영 연결 순서").
      AXCORE_CDC_CONSUMER_ENABLED: ${AXCORE_CDC_CONSUMER_ENABLED:-false}
      # 수집 뒤 검사(SYNC) 주기 요청(191-4). 데이터 기준이 같으면 새로 넣지 않는다.
      # 운영 연결 전까지는 꺼 두고, CDC 소비자와 같이 .env.config에서 true로 켠다(앱 기본값은 true라 로컬 batch에서는 켜져 있다).
      AXCORE_CHECK_SYNC_ENABLED: ${AXCORE_CHECK_SYNC_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - axcore-net

  # 플랫폼 프론트 (React 정적 파일을 컨테이너 안 nginx가 서빙, frontend/Dockerfile). 이미지 태그는 .env의 FRONTEND_TAG (= 커밋 SHA).
  # 바깥 손님은 메인 nginx(443)의 / 를 거쳐 들어온다. 10080은 서버 안 디버그용 (포트 규칙: 1 + 컨테이너 기본 포트. 13000은 grafana 예정).
  frontend:
    image: axcore-frontend:${FRONTEND_TAG}
    container_name: frontend
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:10080:80"
    networks:
      - axcore-net
    # 컨테이너 안에서 자기 문(80)을 두드린다. 응답 없으면 unhealthy. nginx:alpine에는 wget(busybox)이 들어 있다.
    # 주소는 localhost가 아니라 127.0.0.1: 알파인에서 localhost는 IPv6(::1)로 먼저 풀리는데 컨테이너 nginx는 IPv4만 듣는다 (2026-11-01 unhealthy 원인).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 내부 AI 서비스. 이미지 태그는 서버 .env의 AI_TAG로 관리한다.
  ai:
    image: axcore-ai:${AI_TAG}
    container_name: ai
    restart: unless-stopped
    # 시작값이며 배포 후 실측해 조정한다.
    mem_limit: 1g
    environment:
      AI_ONTOLOGY_BACKEND_URL: http://backend:8080
      AI_ONTOLOGY_LLM_PROVIDER: ${AI_ONTOLOGY_LLM_PROVIDER:-gms}
      AI_ONTOLOGY_LLM_API_KEY: ${AI_ONTOLOGY_LLM_API_KEY:-}
      AI_ONTOLOGY_LLM_BASE_URL: ${AI_ONTOLOGY_LLM_BASE_URL:-}
      AI_ONTOLOGY_LLM_MODEL: ${AI_ONTOLOGY_LLM_MODEL:-}
      AI_ONTOLOGY_LLM_TIMEOUT_SEC: ${AI_ONTOLOGY_LLM_TIMEOUT_SEC:-60}
      AI_ONTOLOGY_INTERNAL_TOKEN: ${AI_ONTOLOGY_INTERNAL_TOKEN:-}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:18000:8000"
    networks:
      - axcore-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 지표 저장소. 호스트 포트는 열지 않고 내부망에서만 접근한다.
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    restart: unless-stopped
    # 초기 상한이며 수집 대상 추가 후 실측해 조정한다.
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - axcore-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # 호스트·컨테이너 지표 수집기. 외부 포트는 열지 않으며 런타임 소켓 접근 권한이 있다.
  alloy:
    image: grafana/alloy:v1.21.3
    container_name: alloy
    restart: unless-stopped
    # cAdvisor의 Linux Docker 수집용 권한. 호스트 장치와 런타임에 접근하므로 적용 전 검토한다.
    user: "0:0"
    privileged: true
    cgroup: host
    # 초기 상한이며 서버·컨테이너 수집 추가 후 실측해 조정한다.
    mem_limit: 256m
    environment:
      HOST_ROOTFS_PATH: /rootfs
      HOST_PROCFS_PATH: /rootfs/proc
      HOST_SYSFS_PATH: /rootfs/sys
      HOST_UDEV_DATA_PATH: /rootfs/run/udev/data
      HOST_METRICS_INSTANCE: axcore-main
      DOCKER_LOG_NETWORK: axcore-net
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # 디렉터리의 .alloy 파일을 함께 읽는다.
      - /etc/alloy
    volumes:
      - ./monitoring:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Linux 서버 전체 지표용. 하위 마운트 변경도 전달하며 호스트 루트는 읽기 전용으로 연결한다.
      - /:/rootfs:ro,rslave
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      # :ro는 소켓 파일의 마운트 옵션이며 Docker API 변경 요청까지 제한하지 않는다.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/containerd/containerd.sock
        target: /run/containerd/containerd.sock
        read_only: true
        bind:
          create_host_path: false
    networks:
      - axcore-net

  # 지표 조회 화면. SSH 터널로 접속하며 외부에 직접 공개하지 않는다.
  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    restart: unless-stopped
    # 초기 상한이며 대시보드·조회 부하를 실측한 뒤 조정한다.
    mem_limit: 512m
    environment:
      GF_SERVER_ROOT_URL: https://ontologenie.com/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # 기본 plugins·alerting·dashboards 폴더를 가리지 않고 관리할 파일만 연결한다.
      - ./monitoring/grafana/provisioning/datasources/prometheus.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - ./monitoring/grafana/provisioning/datasources/loki.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
      - ./monitoring/grafana/provisioning/dashboards/axcore.yaml:/etc/grafana/provisioning/dashboards/axcore.yaml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - axcore-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/grafana/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 로그 저장소. Alloy·Grafana가 내부망으로 접근하며 호스트 포트는 열지 않는다.
  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    restart: unless-stopped
    # 초기 상한이며 실제 로그 수집·조회·재시작 부하를 실측해 조정한다.
    mem_limit: 512m
    command:
      - -config.file=/etc/loki/loki.yaml
    volumes:
      - ./monitoring/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - axcore-net
    # 공식 이미지는 셸·wget이 없는 distroless다. 준비 상태는 내부망의 /ready로 별도 확인한다.

networks:
  axcore-net:
    name: axcore-net

volumes:
  pg-data-18:
    name: axcore-pg-data-18
  prometheus-data:
    name: axcore-prometheus-data
  alloy-data:
    name: axcore-alloy-data
  grafana-data:
    name: axcore-grafana-data
  loki-data:
    name: axcore-loki-data
