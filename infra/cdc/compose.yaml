# 원천 CDC용 Kafka와 Kafka Connect(Debezium)(S15P31C106-267).
# 메인 compose.yaml과 따로 관리하는 프로젝트(axcore-cdc)다. 같은 axcore-net에 붙어 배치·backend가 kafka:9092로 닿는다.
# 서버: ~/axcore/cdc/에 이 파일과 .env(ERP_CDC_PASSWORD, MES_CDC_PASSWORD)를 두고
#   cd ~/axcore/cdc && docker compose up -d
# Kafka·Connect는 호스트 포트를 열지 않는다. SSAFY 방화벽은 1024~65535를 열어 두고 Docker 포트는 ufw를 우회한다(infra/README.md).
# 웹 화면(console)만 127.0.0.1에 열어 SSH 터널로 본다.
name: axcore-cdc

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # KRaft 단일 노드(브로커 + 컨트롤러). 복제본이 하나라 내부 토픽 복제 수도 1이다.
  kafka:
    logging: *default-logging
    image: apache/kafka:4.2.2
    container_name: kafka
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      CLUSTER_ID: 6Eh6LS34Rra8hmn_Pe0Oag
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 토픽에 원천 행 값이 들어가므로 짧게 보관한다(7일). 소비자가 이보다 오래 멈추면 플랫폼이 전체 다시 읽기로 복구한다.
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      TZ: Asia/Seoul
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - axcore-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

  # Debezium PostgreSQL 커넥터가 들어 있는 Kafka Connect. 커넥터 등록은 REST(8083)로 컨테이너 안에서만 한다.
  kafka-connect:
    logging: *default-logging
    image: quay.io/debezium/connect:3.6.3.Final
    container_name: kafka-connect
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: axcore-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # 기본 힙(-Xmx2G)을 덮어쓴다. mem_limit 안에 들어가야 컨테이너가 죽지 않는다.
      HEAP_OPTS: -Xms256m -Xmx768m
      # 커넥터 설정에는 비밀번호 대신 ${env:ERP_CDC_PASSWORD}처럼 참조만 적는다. Connect는 설정을 토픽에 그대로 저장하기 때문이다.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      ERP_CDC_PASSWORD: ${ERP_CDC_PASSWORD:?ERP_CDC_PASSWORD must be set}
      MES_CDC_PASSWORD: ${MES_CDC_PASSWORD:?MES_CDC_PASSWORD must be set}
      TZ: Asia/Seoul
    networks:
      - axcore-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Kafka 웹 화면(토픽·메시지·소비자 그룹·커넥터 상태). 로그인 기능이 없어 외부에 열지 않는다.
  # 노트북에서: ssh -i ~/.ssh/K15C106T.pem -L 18082:127.0.0.1:18082 ubuntu@k15c106.p.ssafy.io → http://localhost:18082
  console:
    logging: *default-logging
    image: redpandadata/console:v3.12.0
    container_name: kafka-console
    restart: unless-stopped
    mem_limit: 256m
    environment:
      CONFIG_FILEPATH: /etc/console/console.yaml
      TZ: Asia/Seoul
    volumes:
      - ./console.yaml:/etc/console/console.yaml:ro
    ports:
      - "127.0.0.1:18082:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - axcore-net

networks:
  axcore-net:
    external: true

volumes:
  kafka-data:
    name: axcore-kafka-data
