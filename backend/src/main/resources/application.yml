# 실행 모드는 프로필로 고른다: api(웹 서버), batch(배치 컨테이너), local(로컬 개발).
# 예: SPRING_PROFILES_ACTIVE=api / SPRING_PROFILES_ACTIVE=local,api
spring:
  application:
    name: platform
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # 모든 테이블은 스키마 platform 하나에 둔다. 연결의 search_path를 platform으로 맞춘다.
    hikari:
      schema: platform
  # 스키마는 Flyway가 만들고 db/migration의 V*.sql을 순서대로 적용한다. 이미 적용한 파일은 고치지 않는다.
  flyway:
    schemas: platform
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # 계정은 account 테이블에서 읽는다. 기본 메모리 사용자(로그에 임시 비밀번호를 찍는다)를 만들지 않는다.
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  # 세션 테이블은 Flyway(V4)가 만든다.
  session:
    jdbc:
      initialize-schema: never
  # Spring Batch 실행 기록 테이블도 Flyway(V6)가 만든다. Job은 시작할 때 자동으로 돌리지 않고 코드에서 시작한다.
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
    # Spring AI는 api 프로필의 Agent만 쓴다. 다른 프로필과 테스트에서는 AI 모델을 만들지 않는다.
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

# API 문서(Swagger UI)는 기본으로 닫고 api 프로필에서 연다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 관리자가 한 명도 없을 때 서버 시작 시 만드는 첫 관리자(D02). 값은 환경변수로만 넣는다.
axcore:
  initial-admin:
    login-id: ${AXCORE_INITIAL_ADMIN_LOGIN_ID:}
    password: ${AXCORE_INITIAL_ADMIN_PASSWORD:}
    display-name: 관리자
  # 원천 접속 비밀번호(data_source_credential) 암호화 키. api(등록 때 암호화, 분석 시작 때 AI 계정 복호화)와
  # batch(SYNC 계정 복호화)가 쓴다. 키는 32바이트를 base64로 적고 값은 환경변수로만 넣는다.
  # 새로 암호화할 때는 current-key-version의 키를, 풀 때는 행에 저장된 key_version의 키를 쓴다.
  # 키를 바꿀 때는 keys에 다음 번호를 추가하고 버전을 올린다. 옛 키는 모든 행을 다시 암호화할 때까지 지우지 않는다.
  source-credential:
    current-key-version: ${AXCORE_SOURCE_CREDENTIAL_KEY_VERSION:1}
    keys:
      1: ${AXCORE_SOURCE_CREDENTIAL_KEY_1:}
  # 배치의 연결 검사가 원천 PostgreSQL에 접속할 때 쓰는 sslmode(PostgreSQL JDBC 값). AI 분석 접속과 같이 기본은 require다.
  source-check:
    ssl-mode: ${AXCORE_SOURCE_SSL_MODE:require}
    # Debezium 커넥터가 쓰는 원천 publication 이름(infra/cdc/connectors). 여기 든 표만 수집 방식을 CDC로 둔다.
    cdc-publication: ${AXCORE_SOURCE_CDC_PUBLICATION:axcore_cdc}
  # 원천 데이터 정책(Jira 384·391). 스키마.표.컬럼, 표 전체는 스키마.표.*.
  # forbidden: 들이지 않는다(매핑·적재·표본 모두 막음). restricted: 들이지만 민감(RESTRICTED) 속성으로만 담는다.
  # 원천 계정 권한·publication 스크립트(infra/source-db)와 같은 목록을 유지한다.
  # 닫힌 기본값(405): 섹션이 없거나 금지 목록(forbidden)이 비면(민감 목록만 있어도), 또는 항목 형식이 틀리면 기동하지 않는다. 정책 없이 띄우려면 allow-empty: true를 명시한다.
  # change_log는 근태 키(사번|근무일)를 담는 동기화 기록이라 표 전체를 금지한다(결정 D3).
  source-data-policy:
    forbidden:
      - erp.attendance.*
      - erp.fixed_asset.*
      - erp.change_log.*
      - mes.change_log.*
      - erp.employee.emp_name
      - erp.employee.position
      - erp.employee.hire_date
      - erp.employee.employment_type
      - erp.employee.status
      - mes.worker.name
    restricted:
      - mes.maintenance_order.technician
      - erp.vendor.contact_name
      - mes.worker.skill_level
  # 원천 테이블 전체 읽기(batch, Jira 197). 행을 메모리에 모두 올리므로 한 실행에서 읽는 행 수를 제한한다.
  # 시간대 없는 timestamp 컬럼은 zone-id의 시각으로 보고 DATETIME 속성(시간대 포함)으로 바꾼다.
  source-load:
    max-rows: ${AXCORE_SOURCE_LOAD_MAX_ROWS:200000}
    zone-id: ${AXCORE_SOURCE_LOAD_ZONE_ID:Asia/Seoul}
    # 다시 읽기 표시(loaded_lsn = NULL)가 붙은 CDC 테이블을 찾아 전체 읽기를 넣는 감시 작업(batch, S15P31C106-330).
    # 실패한 테이블은 retry-delay 동안 넣지 않고, 마지막 성공 이후 감시 작업 실행(RECOVERY)이 max-failures번 연속 실패하면 자동으로는 멈춘다(관리자가 073으로 넣는다).
    # 073 수동 실행의 실패는 retry-delay에만 쓰고 멈춤 횟수에는 넣지 않는다.
    reload-watch:
      delay: 10s
      retry-delay: 5m
      max-failures: 3
    # 자동 수집이 켜진 원천(API 072)의 FULL_COMPARE 테이블에 주기마다 전체 읽기(SCHEDULED)를 넣는 작업(batch, S15P31C106-318).
    # 주기가 됐는지 delay마다 확인한다. 주기의 최소값이 1분이라 그보다 짧게 둔다. 끄려면 배포 설정 AXCORE_SOURCE_SCHEDULE_ENABLED=false.
    schedule-watch:
      enabled: ${AXCORE_SOURCE_SCHEDULE_ENABLED:true}
      delay: 30s
  # 끝나지 않고 남은 분석 실행을 FAILED로 정리하는 기준(batch, S15P31C106-273). QUEUED는 요청 시각, RUNNING은 시작 시각부터 잰다.
  # AI 분석 소요 시간 측정(S15P31C106-55) 전 임시값이며, RUNNING 기준은 최대 소요 시간보다 길게 둔다.
  analysis:
    timeout:
      queued: ${AXCORE_ANALYSIS_QUEUED_TIMEOUT:10m}
      running: ${AXCORE_ANALYSIS_RUNNING_TIMEOUT:60m}
      check-delay: 1m
  # 재배정 계획(CREATE_REASSIGNMENT_PLAN) 업무 조건 검사가 읽는 온톨로지 객체 유형·속성 코드.
  # 유형 코드는 운영 온톨로지 코드다(2026-11-12 확인). 임시 하드코딩이며 업무 역할 묶기·관계 기반 구조를 도입하면 삭제한다.
  # Notion '#Action·Agent 기능의 온톨로지 활용 개선안' 참고.
  reassignment:
    equipment:
      type: EQUIPMENT
      code: code
      kind: kind
      capacity: capacity_ton
    work-order:
      type: WORK_ORDER
      number: wo_no
      product: product_code
      status: status
      movable-statuses: [대기, 진행]
    operation:
      type: WORK_ORDER_OPERATION
      work-order: wo_no
      sequence: op_seq
      equipment: equipment_code
      status: status
      finished-statuses: [완료]
    routing:
      type: ROUTING
      product: product_code
      sequence: op_seq
      equipment-kind: equipment_kind
      min-capacity: min_tonnage
  # Agent 완료 시각 계산(ESTIMATE_COMPLETION, FN-AGT-09)이 읽는 온톨로지 객체 유형·속성 코드.
  # 유형 코드는 운영 온톨로지 코드다(2026-11-12 확인). 임시 하드코딩이며 업무 역할 묶기·관계 기반 구조를 도입하면 삭제한다.
  # Notion '#Action·Agent 기능의 온톨로지 활용 개선안' 참고.
  # 진행 중인 공정은 준비(금형 교체)를 마쳤다고 보고 준비 시간을 넣지 않는다. 설비를 주면 그 설비 종류로 하는 공정만 계산한다.
  agent:
    completion-estimate:
      work-order:
        type: WORK_ORDER
        number: wo_no
        product: product_code
      operation:
        type: WORK_ORDER_OPERATION
        work-order: wo_no
        sequence: op_seq
        equipment: equipment_code
        status: status
        remaining-quantity: remaining_qty
        finished-statuses: [완료]
        running-statuses: [진행]
      routing:
        type: ROUTING
        product: product_code
        sequence: op_seq
        equipment-kind: equipment_kind
        cycle-seconds: std_cycle_sec
        setup-minutes: std_setup_min
      equipment:
        type: EQUIPMENT
        code: code
        kind: kind

# 로그 줄마다 요청 추적 ID(RequestIdFilter)를 붙인다. 요청 밖의 로그는 빈 칸이다.
logging:
  pattern:
    correlation: "[%X{requestId:-}] "
