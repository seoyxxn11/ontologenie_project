spring:
  main:
    web-application-type: servlet
  # Agent 답변(085)의 LLM. GMS(OpenAI 호환)에 연결한다. AXCORE_AGENT_LLM=openai와 키를 넣어야 켜지고,
  # 비어 있으면 답변은 "AI 설정 없음"으로 끝난다. 키는 환경 변수로만 넣는다.
  ai:
    model:
      chat: ${AXCORE_AGENT_LLM:none}
    openai:
      api-key: ${AXCORE_AGENT_LLM_API_KEY:}
      base-url: ${AXCORE_AGENT_LLM_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
      max-retries: 1
      chat:
        model: ${AXCORE_AGENT_LLM_MODEL:gpt-6-luna}
        timeout: 30s

# 세션 인증(개발 가이드 11.1). 요청이 없으면 30분 뒤 만료한다. 세션 쿠키 속성은 SessionCookieConfig에 있다.
# nginx가 보낸 X-Forwarded-* 헤더로 HTTPS 주소와 XSRF-TOKEN 쿠키의 Secure를 맞춘다.
server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m

# API 문서는 웹 서버(api 프로필)에서만 연다. 배치 컨테이너는 웹 서버가 없어 열지 않는다.
# 내부 오류 경로(/error, ApiErrorController)는 업무 API가 아니라 문서에서 뺀다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  paths-to-exclude: /error

# 내부 API(/api/v1/internal/**)를 부르는 FastAPI와 나눠 가진 공유 비밀(X-Internal-Token). 값은 환경변수로만 넣는다.
# 비어 있으면 내부 API를 모두 막는다. AI 쪽 AI_ONTOLOGY_INTERNAL_TOKEN과 같은 값이어야 한다.
axcore:
  internal-api:
    token: ${AXCORE_INTERNAL_API_TOKEN:}
  # FastAPI 분석 서비스. 018로 새 실행을 만들면 커밋 뒤 시작을 알린다(API 018 하단). 서버 값은 http://ai:8000(compose).
  # 비어 있으면 알리지 않고 새 실행은 QUEUED로 남는다. 알리지 못하면 실행을 FAILED로 바꾼다.
  ai:
    base-url: ${AXCORE_AI_BASE_URL:}
    connect-timeout: 2s
    read-timeout: 5s

# 수집기는 Docker 내부망으로 접근한다. nginx에 관리 경로를 프록시하지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
