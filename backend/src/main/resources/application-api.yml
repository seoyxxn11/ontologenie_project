spring:
  main:
    web-application-type: servlet
  # Agent 답변(085)의 LLM. GMS(OpenAI 호환)에 연결한다. AXCORE_AGENT_LLM=openai와 키를 넣어야 켜지고,
  # 비어 있으면 답변은 "AI 설정 없음"으로 끝난다. 키는 환경 변수로만 넣는다.
  ai:
    model:
      chat: ${AXCORE_AGENT_LLM:none}
    openai:
      api-key: ${AXCORE_AGENT_LLM_API_KEY:}
      base-url: ${AXCORE_AGENT_LLM_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
      max-retries: 1
      # Agent는 Spring AI chat/completions로 도구를 부른다. 이 방식에서 도구 호출이 되는 모델만 쓸 수 있다(2026-11-10 로컬 확인).
      # 기본: gpt-5.6-luna(2026-11-12 합성 DB 24문항 3회 모두 통과, docs/agent-model-evaluation.md).
      # 된다: gpt-5.6-sol, gpt-6-sol, gpt-5.6-terra, gpt-5.6-luna, gpt-5.5, gpt-5.4,
      # gpt-5.4-mini, gpt-6-luna. 안 된다: gpt-6-astra·gpt-6.1-sol(추론을 끌 수 없어 도구 거절), gpt-5.5-pro·gpt-5.4-pro(채팅 모델 아님).
      chat:
        model: ${AXCORE_AGENT_LLM_MODEL:gpt-5.6-luna}
        timeout: 30s

# 세션 인증(개발 가이드 11.1). 요청이 없으면 30분 뒤 만료한다. 세션 쿠키 속성은 SessionCookieConfig에 있다.
# nginx가 보낸 X-Forwarded-* 헤더로 HTTPS 주소와 XSRF-TOKEN 쿠키의 Secure를 맞춘다.
server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m

# API 문서는 웹 서버(api 프로필)에서만 연다. 배치 컨테이너는 웹 서버가 없어 열지 않는다.
# 내부 오류 경로(/error, ApiErrorController)는 업무 API가 아니라 문서에서 뺀다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  paths-to-exclude: /error

axcore:
  # Agent 답변(도구 사용) 요청의 추론 강도. 도구 호출이 되는 위 모델들은 none으로 확인했다. 비우면 옵션을 보내지 않는다.
  agent:
    reasoning-effort: ${AXCORE_AGENT_LLM_REASONING_EFFORT:none}
    # 질문 해석에 넘길 최근 대화 원문(147). 턴 수와 토큰 상한을 함께 지키고, 토큰은 글자 수로 어림한다. 4턴·2000은 334 비교 실험으로 정했다(docs/agent-context-window-experiment.md).
    history:
      max-turns: ${AXCORE_AGENT_HISTORY_MAX_TURNS:4}
      max-tokens: ${AXCORE_AGENT_HISTORY_MAX_TOKENS:2000}
      # 원문 범위 밖 오래된 대화 요약의 글자 수 상한(333). 원문 상한과 따로 세어 합계는 최대 2500이다. 0이면 요약을 만들지도 넘기지도 않는다.
      summary-max-tokens: ${AXCORE_AGENT_HISTORY_SUMMARY_MAX_TOKENS:500}
    # 객체 유형 사이 경로 후보 도구(OBJECT_PATHS, 381). true일 때만 AI에게 준다. 멀티홉 답변 규칙·GMS 비교(382) 전이라 기본은 끈다.
    object-paths:
      enabled: ${AXCORE_AGENT_OBJECT_PATHS_ENABLED:false}
    # Object Set 도구(OBJECT_SET_START·SEARCH_AROUND·LIST, 380). true일 때만 AI에게 준다. 멀티홉 답변 규칙·GMS 비교(382) 전이라 기본은 끈다.
    object-sets:
      enabled: ${AXCORE_AGENT_OBJECT_SETS_ENABLED:false}
  # 내부 API(/api/v1/internal/**)를 부르는 FastAPI와 나눠 가진 공유 비밀(X-Internal-Token). 값은 환경변수로만 넣는다.
  # 비어 있으면 내부 API를 모두 막는다. AI 쪽 AI_ONTOLOGY_INTERNAL_TOKEN과 같은 값이어야 한다.
  internal-api:
    token: ${AXCORE_INTERNAL_API_TOKEN:}
  # FastAPI 분석 서비스. 018로 새 실행을 만들면 커밋 뒤 시작을 알린다(API 018 하단). 서버 값은 http://ai:8000(compose).
  # 비어 있으면 알리지 않고 새 실행은 QUEUED로 남는다. 알리지 못하면 실행을 FAILED로 바꾼다.
  ai:
    base-url: ${AXCORE_AI_BASE_URL:}
    connect-timeout: 2s
    read-timeout: 5s
  # Handler가 없는 업무 Action이 생기면 개발자에게 알리는 Mattermost 팀 채널 Incoming Webhook(Action 정의서 4-3).
  # 주소는 비밀값이라 환경 변수로만 넣는다. 비어 있으면 알리지 않는다. 실패는 로그만 남기고 다시 보내지 않는다.
  action-notify:
    webhook-url: ${AXCORE_ACTION_NOTIFY_WEBHOOK_URL:}
    # 알림에 넣을 Action 정의 화면의 서비스 주소(일반 설정, 예: https://ontologenie.com). 비우면 링크 없이 보낸다(317)
    screen-base-url: ${AXCORE_ACTION_NOTIFY_SCREEN_BASE_URL:}
    connect-timeout: 2s
    read-timeout: 5s

# 수집기는 Docker 내부망으로 접근한다. nginx에 관리 경로를 프록시하지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
